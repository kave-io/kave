version: v2

# The server owns the canonical Go contract. Kave speaks Connect over HTTP;
# generating a second gRPC server surface only increases the release footprint.
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/kave-io/kave/proto/gen

plugins:
  - local: protoc-gen-go
    out: proto/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: proto/gen
    opt: paths=source_relative
