services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KAVE_POSTGRES_DB:-kave}
      POSTGRES_USER: ${KAVE_POSTGRES_USER:-kave}
      POSTGRES_PASSWORD: ${KAVE_POSTGRES_PASSWORD:-kave}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kave-server:
    image: ghcr.io/kave-io/kave-server:${KAVE_VERSION:-latest}
    restart: unless-stopped
    working_dir: /etc/kave
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KAVE_HTTP_PORT:-18080}:18080"
      - "${KAVE_GRPC_PORT:-19090}:19090"
      - "${KAVE_PROXY_PORT:-18081}:18081"
    environment:
      KAVE_DATA_DIR: /data
      KAVE_POSTGRES_HOST: postgres
      KAVE_POSTGRES_PORT: 5432
      KAVE_POSTGRES_USER: ${KAVE_POSTGRES_USER:-kave}
      KAVE_POSTGRES_PASSWORD: ${KAVE_POSTGRES_PASSWORD:-kave}
      KAVE_POSTGRES_DBNAME: ${KAVE_POSTGRES_DB:-kave}
      KAVE_POSTGRES_SSLMODE: disable
    volumes:
      - kave-data:/data
      - ./kave.yaml:/etc/kave/kave.yaml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/kave-server", "healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kave-data:
  postgres-data:
