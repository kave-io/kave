services:
  kave-server:
    image: ghcr.io/kave-io/kave-server:${KAVE_VERSION:-latest}
    restart: unless-stopped
    working_dir: /etc/kave
    ports:
      - "${KAVE_HTTP_PORT:-18080}:18080"
      - "${KAVE_GRPC_PORT:-19090}:19090"
      - "${KAVE_PROXY_PORT:-18081}:18081"
    environment:
      KAVE_DATA_DIR: /data
    volumes:
      - kave-data:/data
      - ./kave.yaml:/etc/kave/kave.yaml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/kave-server", "healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kave-data:
