apiVersion: kave.io/v1
kind: KaveConfig

daemon:
  address: 0.0.0.0:19090
  proxy_address: 0.0.0.0:18081
  data_dir: /data
  log_level: info
  log_format: json

contexts:
  - name: default
    server: 127.0.0.1:19090
    user: local@kave.local
    project: kave
    env: production
currentContext: default

server:
  addr: 0.0.0.0:18080

grpc:
  addr: 0.0.0.0:19090

storage:
  defaults:
    app:
      kind: sqlite
      path: /data/app.db
    span:
      kind: duckdb
      path: /data/spans.duckdb
