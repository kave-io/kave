services:
  kave-server:
    image: kave-io/kave-server:${KAVE_VERSION:-latest}
    restart: unless-stopped
    working_dir: /etc/kave
    ports:
      - "${KAVE_HTTP_PORT:-18080}:18080"
      - "${KAVE_GRPC_PORT:-19090}:19090"
      - "${KAVE_PROXY_PORT:-18081}:18081"
    environment:
      KAVE_DATA_DIR: /data
      KAVE_POSTGRES_HOST: ${KAVE_POSTGRES_HOST:?set KAVE_POSTGRES_HOST}
      KAVE_POSTGRES_PORT: ${KAVE_POSTGRES_PORT:-5432}
      KAVE_POSTGRES_USER: ${KAVE_POSTGRES_USER:?set KAVE_POSTGRES_USER}
      KAVE_POSTGRES_PASSWORD: ${KAVE_POSTGRES_PASSWORD:?set KAVE_POSTGRES_PASSWORD}
      KAVE_POSTGRES_DBNAME: ${KAVE_POSTGRES_DBNAME:-kave}
      KAVE_POSTGRES_SSLMODE: ${KAVE_POSTGRES_SSLMODE:-disable}
    volumes:
      - kave-data:/data
      - ./kave.yaml:/etc/kave/kave.yaml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/kave-server", "healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kave-data:
