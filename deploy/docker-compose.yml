version: "3.8"

services:
  kave:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      KAVE_SERVER_PORT: 8080
      KAVE_STORAGE_BACKEND: sqlite
      KAVE_STORAGE_SQLITE_PATH: /data/kave.db
      KAVE_STORAGE_SPAN_BACKEND: duckdb
      KAVE_STORAGE_DUCKDB_PATH: /data/kave-spans.duckdb
    ports:
      - "8080:8080"
    volumes:
      - kave-data:/data

  # Optional: Scale tier — uncomment to use PostgreSQL
  # postgres:
  #   image: postgres:18-alpine
  #   profiles: [scale]
  #   environment:
  #     POSTGRES_DB: kave
  #     POSTGRES_USER: kave
  #     POSTGRES_PASSWORD: kave
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  # Optional: Scale tier — uncomment to use ClickHouse for spans
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24-alpine
  #   profiles: [scale]
  #   volumes:
  #     - chdata:/var/lib/clickhouse

volumes:
  kave-data:
  # pgdata:
  # chdata:
