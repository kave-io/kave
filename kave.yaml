# yaml-language-server: $schema=https://kave.io/schemas/v1/kave-config.schema.json
# -----------------------------------------------------------------------------
# kave.yaml — complete example
#
# This file demonstrates every supported section. In practice you'd keep most
# of these at the user or system layer and only commit project-relevant bits
# to version control. Secrets never live inline; they're resolved from env
# vars, files, or an external secret manager.
# -----------------------------------------------------------------------------

apiVersion: kave.io/v1
kind: KaveConfig

# =============================================================================
# 1. Daemon
# =============================================================================
# Runtime infrastructure for the local daemon. Usually set at the user or
# system layer, not in a project's committed kave.yaml.

daemon:
  address: ${KAVE_DAEMON_ADDRESS:-127.0.0.1:7777}
  proxy_address: ${KAVE_PROXY_ADDRESS:-127.0.0.1:7778}
  data_dir: ~/.kave
  log_level: info       # trace | debug | info | warn | error
  log_format: text      # text | json

# =============================================================================
# 2. Stores
# =============================================================================
# Three logical stores. Start with SQLite + DuckDB for local-first; upgrade
# to Postgres when sharing across users or deploying multi-node.

stores:
  app:
    backend: sqlite
    dsn: file:~/.kave/app.db?_journal=WAL&_busy_timeout=5000
  spans:
    backend: duckdb
    dsn: file:~/.kave/spans.db
  audit:
    backend: sqlite
    dsn: file:~/.kave/audit.db?_journal=WAL

# =============================================================================
# 3. Contexts
# =============================================================================
# Named bundles for the CLI. `kave ctx use <name>` switches the active one.
# Contexts are a pure-CLI concept — the daemon has no opinion.

contexts:
  - name: default
    server: 127.0.0.1:7777
    user: ali@local
    project: kave-local
    env: dev

  - name: staging
    server: 127.0.0.1:7777
    user: ali@local
    project: kave-local
    env: staging

  - name: prod-remote
    server: kave.internal.example.com:443
    user: ali@example.com
    project: main
    env: prod

currentContext: default

# =============================================================================
# 4. Project
# =============================================================================
# Tenancy root. In single-project deployments there's one of these per repo.

project:
  name: kave-local
  slug: kave-local
  description: Local development project for the Kave team

  envs:
    - name: dev
      slug: dev
      type: dev
    - name: staging
      slug: staging
      type: staging
    - name: prod
      slug: prod
      type: prod

  defaultEnv: dev

# =============================================================================
# 5. Connectors
# =============================================================================
# Enable/disable the compiled-in connectors. Connectors are provided by the
# Kave binary; this section toggles them and carries per-connector config.
# Secrets never live here — see `credentials` below.

connectors:
  - name: anthropic
    enabled: true

  - name: openai
    enabled: true

  - name: gemini
    enabled: false

  - name: ollama
    enabled: true
    config:
      host: http://localhost:11434

  - name: groq
    enabled: false

  - name: github
    enabled: true

  - name: postgres
    enabled: true

# =============================================================================
# 6. Credentials
# =============================================================================
# Outbound secrets. Each entry is a named reference — never a plaintext value.
# Kave supports four sources:
#
#   env         → value read from an environment variable
#   file        → value read from a file (with mode check)
#   vault       → value fetched from an external secret manager
#   passthrough → no stored secret; daemon forwards caller's credential
#
# The `encrypted` source (stored inside Kave, wrapped with a master key) is
# created via `kave credential create --source encrypted`, NOT declared here.

credentials:
  - name: oai-primary
    connector: openai
    label: primary
    source: env
    env: OPENAI_API_KEY

  - name: anthropic-primary
    connector: anthropic
    label: primary
    source: env
    env: ANTHROPIC_API_KEY

  - name: anthropic-canary
    connector: anthropic
    label: canary
    source: env
    env: ANTHROPIC_API_KEY_CANARY

  - name: github-prod
    connector: github
    label: primary
    source: vault
    ref: kv/data/kave/github-prod#token

  - name: postgres-local
    connector: postgres
    label: primary
    source: file
    file: ~/.kave/secrets/pg-local.txt
    mode: "0600"

  - name: caller-openai
    connector: openai
    label: passthrough
    source: passthrough

# =============================================================================
# 7. Policies
# =============================================================================
# What agents are allowed to do through Kave. Four dimensions:
#   auth       — allow-listed types, connectors, methods
#   cost       — budget cap, period, behavior on overrun
#   trace      — what to capture and how long to keep
#   validation — schema/output validation rules

policies:
  # Strict production policy: chat completions only, hard budget.
  - name: strict
    description: Chat-only; hard monthly budget; full trace capture
    mode: enforce            # enforce | shadow
    auth:
      allowedTypes: [llm]
      allowedConnectors: [openai, anthropic]
      allowedMethods: [chat.completions, messages]
    cost:
      budgetCap: { amount: "100.00", currency: USD }
      budgetPeriod: monthly  # run | daily | monthly
      budgetBehavior: block  # block | warn
    trace:
      input: true
      output: true
      retentionDays: 30
    validation:
      enabled: false

  # Exploratory dev policy: everything allowed, observed only, cheap daily cap.
  - name: exploratory
    description: Dev-only, shadow mode, daily soft cap
    mode: shadow
    auth:
      allowedTypes: [llm, tool, retrieval, api]
    cost:
      budgetCap: { amount: "10.00", currency: USD }
      budgetPeriod: daily
      budgetBehavior: warn
    trace:
      input: false
      output: false
      retentionDays: 7
    validation:
      enabled: false

  # Validation-heavy policy for structured-output use cases.
  - name: structured
    description: Requires JSON-schema-valid responses; retries on violation
    mode: enforce
    auth:
      allowedTypes: [llm]
      allowedConnectors: [openai, anthropic]
      allowedMethods: [chat.completions, messages]
    cost:
      budgetCap: { amount: "50.00", currency: USD }
      budgetPeriod: monthly
      budgetBehavior: block
    trace:
      input: true
      output: true
      retentionDays: 30
    validation:
      enabled: true
      retryable: true
      config:
        schema: ./schemas/agent-output.schema.json
        maxRetries: 2

# =============================================================================
# 8. Agents
# =============================================================================
# Agent identities. Each agent belongs to an env, references a policy by name,
# and attaches zero or more credentials.

agents:
  - name: prod-bot
    description: Production customer support bot
    env: prod
    policy: strict
    credentials: [oai-primary, anthropic-primary]
    monthlyBudget: { amount: "500.00", currency: USD }
    status: active
    metadata:
      team: support
      owner: ali@example.com

  - name: dev-bot
    description: Local experimentation and prompt engineering
    env: dev
    policy: exploratory
    credentials: [oai-primary, anthropic-primary]
    status: active
    metadata:
      team: platform

  - name: structured-extractor
    description: Structured data extraction from docs
    env: prod
    policy: structured
    credentials: [anthropic-primary]
    monthlyBudget: { amount: "200.00", currency: USD }
    status: active

# =============================================================================
# 9. Pricing
# =============================================================================
# The default price book ships with the binary. Overrides here let you adjust
# for private deployments, negotiated rates, or new models not yet in the
# built-in catalog. Entries merge with defaults by (provider, match).

pricing:
  # Optional external price book file. Takes precedence over built-ins but
  # loses to overrides below.
  priceBook: ~/.kave/pricebook.yaml

  overrides:
    - provider: openai
      match: "gpt-5-pro"
      currency: USD
      inputPerMillion:  { amount: "10.00", currency: USD }
      outputPerMillion: { amount: "30.00", currency: USD }
      effectiveFromMs: 1776000000000
      revisionNote: "Negotiated enterprise rate, 2026-Q2"

    - provider: anthropic
      match: "claude-opus-4-7"
      currency: USD
      inputPerMillion:  { amount: "15.00", currency: USD }
      outputPerMillion: { amount: "75.00", currency: USD }
      cacheReadPerMillion:  { amount: "1.50", currency: USD }
      cacheWritePerMillion: { amount: "18.75", currency: USD }
      effectiveFromMs: 1776000000000

# =============================================================================
# 10. UI and ergonomics
# =============================================================================
# Human-facing preferences. None of these affect daemon behavior.

ui:
  preferredCurrency: USD    # display currency in CLI and dashboard
  locale: en                # en | fa | es | ...
  colorMode: auto           # auto | always | never
  dateStyle: relative       # relative | absolute
  tableStyle: rounded       # rounded | ascii | minimal
