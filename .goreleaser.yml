version: 2

project_name: kave

before:
  hooks:
    - make dashboard-build

builds:
  - id: kave-server
    dir: server
    main: .
    binary: kave-server
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.buildVersion={{ .Tag }}

archives:
  - id: kave-server
    ids:
      - kave-server
    formats:
      - tar.gz
    name_template: "kave-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.spdx.json"

signs:
  - artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge "

release:
  # Keep every artifact non-public until the container has also been signed
  # and smoke-tested. The release workflow publishes this draft last.
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
