name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  fmt-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - run: make fmt
      - name: Verify no formatting drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "gofmt produced changes — commit them:"
            git --no-pager diff
            exit 1
          fi
      - run: make vet

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: make lint
      - run: make lint-arch

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - run: make test-unit

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - run: make test-integration

  test-v2-postgres:
    name: test-v2-postgres (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KAVE_TEST_V2_POSTGRES_ADMIN_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - name: Create isolated V2 test databases
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE kave_v2_store;
          CREATE DATABASE kave_v2_kernel;
          SQL
      - name: Vet the V2 kernel
        working-directory: server
        run: go vet ./internal/v2/...
      - name: Race-test the V2 Postgres stores and runtime-role contract
        working-directory: server
        env:
          KAVE_TEST_V2_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/kave_v2_store?sslmode=disable
        run: go test -race -count=1 -timeout=12m ./internal/v2/postgres
      - name: Race-test the fresh-database V2 kernel acceptance flow
        working-directory: server
        env:
          KAVE_TEST_V2_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/kave_v2_kernel?sslmode=disable
        run: go test -race -count=1 -timeout=6m ./internal/v2 -run '^TestKernelPostgres_'

  test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - run: make test-contracts

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: Breaking change check (vs main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: dashboard
        run: bun install --frozen-lockfile
      - working-directory: dashboard
        run: bun run build

  build:
    needs: [test-unit, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: make build
