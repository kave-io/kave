name: release

on:
  push:
    tags: ["v2.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate the immutable release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$release_commit" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            core/go.sum
            proto/gen/go.sum
            server/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.69.0"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          install-only: true
          version: "v2.17.0"

      - name: Install release dependencies
        run: |
          cd dashboard
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          cd ..
          mkdir -p "$RUNNER_TEMP/go-tools"
          echo "$RUNNER_TEMP/go-tools" >> "$GITHUB_PATH"
          export GOBIN="$RUNNER_TEMP/go-tools"
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Verify source, contracts, tests, and release schema
        run: |
          KAVE_PLAYWRIGHT_USE_BUNDLED=1 make check
          make security-check
          buf lint
          goreleaser check

      - name: Generate ephemeral package-smoke keys
        run: |
          master_key="$(openssl rand -hex 32)"
          idempotency_key="$(openssl rand -hex 32)"
          echo "::add-mask::$master_key"
          echo "::add-mask::$idempotency_key"
          echo "KAVE_RUNTIME_MASTER_KEY=$master_key" >> "$GITHUB_ENV"
          echo "KAVE_RUNTIME_SECRET_IDEMPOTENCY_KEY=$idempotency_key" >> "$GITHUB_ENV"

      - name: Start isolated PostgreSQL and run database race suites
        env:
          KAVE_IMAGE_TAG: release-check
          KAVE_BUILD_VERSION: ${{ github.ref_name }}
          KAVE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          docker compose config --quiet
          docker compose up -d postgres --wait
          docker compose exec -T postgres psql -U postgres -d postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE kave_store;
          CREATE DATABASE kave_kernel;
          SQL
          cd server
          KAVE_TEST_V2_POSTGRES_ADMIN_DSN='postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable' \
          KAVE_TEST_V2_POSTGRES_DSN='postgres://postgres@127.0.0.1:5432/kave_store?sslmode=disable' \
            go test -race -count=1 -timeout=15m ./internal/v2/postgres
          KAVE_TEST_V2_POSTGRES_ADMIN_DSN='postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable' \
          KAVE_TEST_V2_POSTGRES_DSN='postgres://postgres@127.0.0.1:5432/kave_kernel?sslmode=disable' \
            go test -race -count=1 -timeout=8m ./internal/v2 -run '^TestKernelPostgres_'

      - name: Build and smoke-test the complete package
        env:
          KAVE_IMAGE_TAG: release-check
          KAVE_BUILD_VERSION: ${{ github.ref_name }}
          KAVE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          docker compose build
          docker run --rm kave:release-check version
          runtime_user="$(docker image inspect kave:release-check --format '{{.Config.User}}')"
          test -n "$runtime_user"
          test "$runtime_user" != root
          test "$runtime_user" != 0
          test "$runtime_user" != 0:0
          docker compose up --no-build --wait
          curl --fail --silent --show-error http://127.0.0.1:8080/livez
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          curl --fail --silent --show-error http://127.0.0.1:8080/metrics >/dev/null

      - name: Tear down the release-check stack
        if: always()
        env:
          KAVE_IMAGE_TAG: release-check
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            core/go.sum
            proto/gen/go.sum
            server/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.0.6
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.44.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          install-only: true
          version: "v2.17.0"

      - name: Create the signed draft release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify archive checksums
        working-directory: dist
        run: |
          sha256sum --check checksums.txt
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      - name: Attest release archives and evidence
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            dist/kave-server_*.tar.gz
            dist/checksums.txt
            dist/*.sbom.spdx.json

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the multi-architecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}

      - name: Sign and smoke-test the immutable image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST"
          docker run --rm --platform linux/amd64 "$IMAGE@$DIGEST" version

      - name: Promote the verified version image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE@$DIGEST"

      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
