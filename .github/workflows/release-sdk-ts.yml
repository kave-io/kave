name: release-sdk-ts

on:
  push:
    tags: ["sdk/ts/v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      provenance-subjects: ${{ steps.provenance-subjects.outputs.subjects }}
    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          path: core
          fetch-depth: 0

      - name: Checkout TypeScript SDK
        uses: actions/checkout@v4
        with:
          repository: kave-io/ts-sdk
          path: sdk/ts
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Enforce changelog entry
        run: core/scripts/check-sdk-changelog.sh ts "${GITHUB_REF_NAME#sdk/ts/}"

      - name: Install dependencies
        working-directory: sdk/ts
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        working-directory: sdk/ts
        run: |
          bun run typecheck
          bun test

      - name: Build package
        working-directory: sdk/ts
        run: bun run build

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: sdk/ts
          format: spdx-json
          output-file: sdk/ts/kave-sdk-typescript.sbom.spdx.json

      - name: Pack package
        working-directory: sdk/ts
        run: npm pack

      - name: Cosign package bundle
        working-directory: sdk/ts
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for artifact in ./*.tgz ./kave-sdk-typescript.sbom.spdx.json; do
            cosign sign-blob --yes \
              --output-signature="${artifact}.cosign.sig" \
              --output-certificate="${artifact}.cosign.pem" \
              "$artifact"
          done

      - name: Publish to npm with provenance
        working-directory: sdk/ts
        run: npm publish --access public --provenance

      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            sdk/ts/*.tgz
            sdk/ts/kave-sdk-typescript.sbom.spdx.json
            sdk/ts/*.cosign.sig
            sdk/ts/*.cosign.pem

      - name: Collect provenance subjects
        id: provenance-subjects
        working-directory: sdk/ts
        run: |
          set -euo pipefail
          subjects="$(find . -maxdepth 1 \( -name '*.tgz' -o -name '*.spdx.json' -o -name '*.cosign.sig' -o -name '*.cosign.pem' \) -print0 | sort -z | xargs -0 sha256sum | base64 -w0)"
          echo "subjects=${subjects}" >> "$GITHUB_OUTPUT"

  provenance:
    needs: publish
    if: needs.publish.outputs.provenance-subjects != ''
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish.outputs.provenance-subjects }}
      upload-assets: true
