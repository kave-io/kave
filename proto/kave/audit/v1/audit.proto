syntax = "proto3";

package kave.audit.v1;

option go_package = "github.com/kave-io/kave/proto/gen/kave/audit/v1;audit";

// AuditActorType discriminates the type of actor performing an action.
enum AuditActorType {
  AUDIT_ACTOR_TYPE_UNSPECIFIED = 0;
  AUDIT_ACTOR_TYPE_USER = 1;
  AUDIT_ACTOR_TYPE_API_KEY = 2;
  AUDIT_ACTOR_TYPE_SYSTEM = 3;
}

// AuditLog is an append-only record of every control-plane mutation.
// Never updated or deleted — compliance requirement.
message AuditLog {
  string id = 1;
  string org_id = 2;
  optional string project_id = 3; // nil for org-level events
  optional string env_id = 4; // nil for project-level events
  string actor_id = 5; // user ID, machine identity ID, or "system"
  AuditActorType actor_type = 6;
  string event = 7; // "policy.created" | "credential.rotated" | "token.revoked" | ...
  string resource_type = 8; // "policy" | "credential" | "agent" | "token" | "user" | ...
  string resource_id = 9;
  optional bytes diff_before = 10; // JSON-encoded resource before mutation; nil for creates
  optional bytes diff_after = 11; // JSON-encoded resource after mutation; nil for deletes
  optional string ip = 12; // source IP; nil for system events
  int64 created_at_ms = 13; // UnixMilli; server-assigned
  optional bytes provenance = 14; // JSON-encoded money/FX provenance for reproducible audits
}

// AppendAuditInput is the write payload for a new audit log entry.
// The server assigns id and created_at_ms.
message AppendAuditInput {
  string org_id = 1;
  optional string project_id = 2;
  optional string env_id = 3;
  string actor_id = 4;
  AuditActorType actor_type = 5;
  string event = 6;
  string resource_type = 7;
  string resource_id = 8;
  optional bytes diff_before = 9; // nil for creates
  optional bytes diff_after = 10; // nil for deletes
  optional string ip = 11;
  optional bytes provenance = 12; // nil when no money/FX provenance applies
}

// AuditFilter filters audit log queries. Pagination (limit, page_token) is
// carried on the enclosing request, not the filter itself.
message AuditFilter {
  string org_id = 1;
  string project_id = 2;
  string env_id = 3;
  string actor_id = 4;
  string resource_type = 5;
  string resource_id = 6;
  string event = 7;
  optional int64 from_ms = 8;
  optional int64 to_ms = 9;
  reserved 10, 11;
  reserved "limit", "page_token";
}

// Service for audit operations (gRPC v1).
service AuditService {
  // AppendAudit adds an audit log entry (control plane only; not exposed to end users).
  rpc AppendAudit(AppendAuditRequest) returns (AuditLog);

  // QueryAudits retrieves audit logs matching a filter.
  rpc QueryAudits(QueryAuditsRequest) returns (QueryAuditsResponse);
}

message AppendAuditRequest {
  AppendAuditInput entry = 1;
}

message QueryAuditsRequest {
  AuditFilter filter = 1;
  int32 limit = 2;
  string page_token = 3;
}

message QueryAuditsResponse {
  repeated AuditLog entries = 1;
  string next_page_token = 2; // empty = no more pages
}
