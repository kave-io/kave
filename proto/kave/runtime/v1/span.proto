syntax = "proto3";

package kave.runtime.v1;

import "kave/common/v1/common.proto";
import "kave/runtime/v1/cost.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/runtime/v1;runtime";

// SpanKind classifies what sort of execution a span represents.
enum SpanKind {
  SPAN_KIND_UNSPECIFIED = 0;
  SPAN_KIND_ACTION = 1; // intercepted action Kave executed
  SPAN_KIND_OBSERVED_ACTION = 2; // action reported by the agent after the fact
  SPAN_KIND_IMPORT = 3; // span imported from an external trace source
}

// SpanSource explains how Kave learned about a span.
enum SpanSource {
  SPAN_SOURCE_UNSPECIFIED = 0;
  SPAN_SOURCE_INTERCEPT = 1; // produced by the intercept pipeline
  SPAN_SOURCE_REPORT = 2; // reported via SDK report-in
  SPAN_SOURCE_OTEL_IMPORT = 3; // imported from OpenTelemetry
}

// ValidationMeta carries validation execution details for a span.
// Matches core runtime.ValidationMeta one-for-one.
message ValidationMeta {
  bool valid = 1;
  int32 violation_count = 2;
  string enforcement_mode = 3; // "block" | "warn" | "audit"
  string validator_name = 4;
  string validator_version = 5;
  string rule_version = 6;
  int64 duration_ms = 7;
  bool retryable = 8;
}

// SpanInput contains the fields provided when opening a new span.
// Server assigns id and created_at_ms.
message SpanInput {
  string project_id = 1;
  string env_id = 2;
  string agent_id = 3;
  string run_id = 4;
  string action_id = 5;
  optional string parent_id = 6;
  string name = 7;
  SpanKind kind = 8;
  SpanSource source = 9;
  string connector = 10;
  int64 started_at_ms = 11; // UnixMilli
  optional bytes input = 12; // nil = not captured
  string trace_id = 13; // OTel trace correlation ID
  string root_span_id = 14; // root span ID of this trace
}

// SpanRow is the flat database representation of a trace span.
message SpanRow {
  string id = 1;
  string project_id = 2;
  string env_id = 3;
  string agent_id = 4;
  string run_id = 5;
  string action_id = 6;
  optional string parent_id = 7;
  string name = 8;
  SpanKind kind = 9;
  SpanSource source = 10;
  string connector = 11;
  int64 started_at_ms = 12; // UnixMilli
  optional int64 ended_at_ms = 13; // UnixMilli
  int64 duration_ms = 14;

  // Payloads: nil = not captured
  optional bytes input = 15;
  optional bytes output = 16;
  optional bytes attrs = 17; // typed attributes (AttrVal as JSON)
  optional string error = 18;

  optional int32 input_tokens = 19;
  optional int32 output_tokens = 20;
  optional int32 cache_read_tokens = 21;
  optional int32 cache_write_tokens = 22;
  optional int32 reasoning_tokens = 23;
  optional int32 audio_input_tokens = 24;
  optional int32 audio_output_tokens = 25;
  optional int32 image_units = 26;
  optional int32 request_count = 27;
  optional int64 compute_ms = 28;
  optional int64 storage_bytes = 29;
  optional int64 bandwidth_bytes = 30;

  optional string model = 31;
  optional kave.common.v1.Amount cost = 32;
  optional PriceSnapshot price_snapshot = 33;

  string trace_id = 34; // OTel trace correlation ID
  string root_span_id = 35; // root span ID of this trace
  optional ValidationMeta validation_meta = 36;
  int64 created_at_ms = 37; // UnixMilli; server-assigned
}

// SpanEnd captures the fields that become available when a span is finalized.
message SpanEnd {
  optional int64 ended_at_ms = 1; // UnixMilli
  int64 duration_ms = 2;

  // Payloads: nil = not captured
  optional bytes output = 3;
  optional bytes attrs = 4; // typed attributes (AttrVal as JSON)
  optional string error = 5;

  optional int32 input_tokens = 6;
  optional int32 output_tokens = 7;
  optional int32 cache_read_tokens = 8;
  optional int32 cache_write_tokens = 9;
  optional int32 reasoning_tokens = 10;
  optional int32 audio_input_tokens = 11;
  optional int32 audio_output_tokens = 12;
  optional int32 image_units = 13;
  optional int32 request_count = 14;
  optional int64 compute_ms = 15;
  optional int64 storage_bytes = 16;
  optional int64 bandwidth_bytes = 17;

  optional string model = 18;
  optional kave.common.v1.Amount cost = 19;
  optional PriceSnapshot price_snapshot = 20;

  string trace_id = 21; // OTel trace correlation ID
  string root_span_id = 22; // root span ID of this trace
  optional ValidationMeta validation_meta = 23;
}

// SpanFilter filters QuerySpans queries. Pagination (limit, page_token) is
// carried on the enclosing request, not the filter itself.
message SpanFilter {
  string run_id = 1;
  string action_id = 2;
  optional int64 from_ms = 3;
  optional int64 to_ms = 4;
  optional bool has_error = 5;
  reserved 6, 7;
  reserved "limit", "page_token";
}
