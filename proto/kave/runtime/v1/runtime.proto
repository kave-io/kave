syntax = "proto3";

package kave.runtime.v1;

import "kave/common/v1/common.proto";
import "kave/runtime/v1/action.proto";
import "kave/runtime/v1/cost.proto";
import "kave/runtime/v1/fx.proto";
import "kave/runtime/v1/run.proto";
import "kave/runtime/v1/span.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/runtime/v1;runtime";

// RuntimeAPI exposes run, action, span, and cost operations.
// v1: gRPC only. HTTP transcoding deferred to v1.1+.
service RuntimeService {
  // Run operations
  rpc CreateRun(CreateRunRequest) returns (RunRecord);
  rpc GetRun(GetRunRequest) returns (RunRecord);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc UpdateRun(UpdateRunRequest) returns (RunRecord);
  rpc CancelRun(CancelRunRequest) returns (RunRecord);
  rpc WatchRuns(WatchRunsRequest) returns (stream RunRecord);

  // Action operations
  rpc CreateAction(CreateActionRequest) returns (ActionRecord);
  rpc GetAction(GetActionRequest) returns (ActionRecord);
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);

  // Span operations
  rpc OpenSpan(OpenSpanRequest) returns (SpanRow);
  rpc CloseSpan(CloseSpanRequest) returns (SpanRow);
  rpc GetSpan(GetSpanRequest) returns (SpanRow);
  rpc QuerySpans(QuerySpansRequest) returns (QuerySpansResponse);

  // Streaming operations
  rpc WatchEvents(WatchEventsRequest) returns (stream RuntimeEvent);
  rpc WatchLogs(WatchLogsRequest) returns (stream LogLine);
  rpc TailTraces(TailTracesRequest) returns (stream TraceEvent);
  rpc StreamSpans(StreamSpansRequest) returns (stream SpanEvent);

  // Trace operations
  rpc ExportTrace(ExportTraceRequest) returns (ExportTraceResponse);
  rpc IngestTraces(IngestTracesRequest) returns (IngestTracesResponse);

  // Cost operations
  rpc GetPriceBook(GetPriceBookRequest) returns (PriceBook);
  rpc GetSpendReport(GetSpendReportRequest) returns (SpendReport);

  // Aggregate read models
  rpc GetDashboardOverview(GetDashboardOverviewRequest) returns (DashboardOverview);
  rpc GetTraceGraph(GetTraceGraphRequest) returns (TraceGraph);
}

// --- Run ---

message CreateRunRequest {
  string project_id = 1;
  string env_id = 2;
  string agent_id = 3;
  optional string policy_id = 4;
  string name = 5;
  TriggerType trigger_type = 6;
  optional string trigger_id = 7;
  optional string correlation_id = 8;
  optional string session_id = 9;
  optional string idempotency_key = 10;
}

message GetRunRequest {
  string id = 1;
}

message ListRunsRequest {
  RunFilter filter = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListRunsResponse {
  repeated RunRecord runs = 1;
  string next_cursor = 2;
}

message UpdateRunRequest {
  string id = 1;
  RunUpdate update = 2;
}

message CancelRunRequest {
  string id = 1;
  optional string reason = 2;
}

// WatchRunsRequest streams RunRecord events for the given scope.
message WatchRunsRequest {
  string env_id = 1;
  optional string agent_id = 2;
  repeated RunStatus statuses = 3; // empty = all statuses
}

// --- Action ---

message CreateActionRequest {
  string run_id = 1;
  string agent_id = 2;
  string project_id = 3;
  string env_id = 4;
  ActionType action_type = 5;
  string connector = 6;
  string method = 7;
}

message GetActionRequest {
  string id = 1;
}

message ListActionsRequest {
  ActionFilter filter = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListActionsResponse {
  repeated ActionRecord actions = 1;
  string next_cursor = 2;
}

// --- Span ---

message OpenSpanRequest {
  SpanInput span = 1;
}

message CloseSpanRequest {
  string span_id = 1;
  SpanEnd end = 2;
}

message GetSpanRequest {
  string id = 1;
}

message QuerySpansRequest {
  SpanFilter filter = 1;
  int32 limit = 2;
  string cursor = 3;
}

message QuerySpansResponse {
  repeated SpanRow spans = 1;
  string next_cursor = 2;
}

// --- Streaming ---

message WatchEventsRequest {
  string env_id = 1;
  string project_id = 2;
  string kind = 3; // optional: filter by event kind
}

message RuntimeEvent {
  string kind = 1;
  int64 at = 2;
  bytes data = 3; // JSON-encoded event data
}

message WatchLogsRequest {
  string level = 1; // optional: "debug", "info", "warn", "error"
}

message LogLine {
  int64 at = 1;
  string level = 2;
  string message = 3;
  map<string, string> context = 4;
}

message TailTracesRequest {
  string project_id = 1;
  string env_id = 2;
  string run_id = 3;
}

message TraceEvent {
  string kind = 1; // "Run", "Span"
  int64 at = 2;
  bytes data = 3; // JSON-encoded run or span
}

message StreamSpansRequest {
  string project_id = 1;
  string env_id = 2;
  string run_id = 3;
}

message SpanEvent {
  int64 at = 1;
  SpanRow span = 2;
}

// --- Trace Export/Ingest ---

message ExportTraceRequest {
  string trace_id = 1;
  string format = 2; // "jsonl", "mermaid", "dot", "otlp", "parquet"
}

message ExportTraceResponse {
  bytes data = 1;
  string content_type = 2;
}

message IngestTracesRequest {
  bytes data = 1; // OTLP ExportTraceServiceRequest (protobuf or JSON)
  string format = 2; // "protobuf" or "json"
}

message IngestTracesResponse {
  int32 accepted = 1;
}

// --- Cost ---

message GetPriceBookRequest {}

message GetSpendReportRequest {
  SpendFilter filter = 1;
}

// --- Aggregate Read Models ---

message GetDashboardOverviewRequest {
  string project_id = 1;
  string env_id = 2;
  optional int64 from_ms = 3;
  optional int64 to_ms = 4;
  int32 recent_limit = 5;
}

message DashboardOverview {
  int32 total_runs = 1;
  int32 active_runs = 2;
  int32 blocked_runs = 3;
  int32 failed_runs = 4;
  int64 avg_latency_ms = 5;
  int64 total_input_tokens = 6;
  int64 total_output_tokens = 7;
  SpendReport spend = 8;
  repeated RunRecord recent_runs = 9;
  repeated RunRecord recent_attention_runs = 10;
  repeated DashboardAgentSpend top_agents = 11;
}

message DashboardAgentSpend {
  string agent_id = 1;
  string agent_name = 2;
  kave.common.v1.Amount spend = 3;
  int32 run_count = 4;
}

message GetTraceGraphRequest {
  string run_id = 1;
  string trace_id = 2;
  int32 limit = 3;
}

message TraceGraph {
  RunRecord run = 1;
  repeated SpanRow spans = 2;
  repeated TraceGraphNode nodes = 3;
  repeated TraceGraphEdge edges = 4;
  int64 total_duration_ms = 5;
  kave.common.v1.Amount total_cost = 6;
  int64 total_input_tokens = 7;
  int64 total_output_tokens = 8;
}

message TraceGraphNode {
  string span_id = 1;
  string parent_span_id = 2;
  string name = 3;
  string connector = 4;
  string model = 5;
  bool has_error = 6;
  int32 depth = 7;
  int64 offset_ms = 8;
  int64 duration_ms = 9;
  kave.common.v1.Amount cost = 10;
  int64 input_tokens = 11;
  int64 output_tokens = 12;
}

message TraceGraphEdge {
  string parent_span_id = 1;
  string child_span_id = 2;
}
