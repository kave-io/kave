syntax = "proto3";

package kave.runtime.v1;

import "google/protobuf/struct.proto";
import "kave/common/v1/common.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/runtime/v1;runtime";

// TriggerType discriminates how a run was initiated.
enum TriggerType {
  TRIGGER_TYPE_UNSPECIFIED = 0;
  TRIGGER_TYPE_API = 1;
  TRIGGER_TYPE_SCHEDULE = 2;
  TRIGGER_TYPE_WEBHOOK = 3;
  TRIGGER_TYPE_MANUAL = 4;
}

// RunStatus is the lifecycle status of a run.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_ACTIVE = 1;
  RUN_STATUS_COMPLETED = 2;
  RUN_STATUS_FAILED = 3;
  RUN_STATUS_CANCELLED = 4;
  RUN_STATUS_TIMED_OUT = 5;
  RUN_STATUS_BLOCKED = 6;
}

// RunRecord represents a persisted run record in the database.
message RunRecord {
  string id = 1;
  string project_id = 2;
  string env_id = 3;
  string agent_id = 4;
  optional string policy_id = 5;
  string name = 6;
  RunStatus status = 7;
  optional kave.common.v1.Amount budget_cap = 8; // nil = no cap
  optional kave.common.v1.Amount spent = 9;
  google.protobuf.Struct metadata = 10;

  optional string error_message = 11;

  // Provenance
  TriggerType trigger_type = 12;
  optional string trigger_id = 13; // schedule ID, webhook ID, etc.
  optional string correlation_id = 14; // external correlation
  optional string session_id = 15; // groups related runs
  optional string idempotency_key = 16; // unique per env

  int64 started_at_ms = 17; // UnixMilli
  optional int64 ended_at_ms = 18; // UnixMilli; nil if still running
  int64 created_at_ms = 19; // UnixMilli
  int64 updated_at_ms = 20; // UnixMilli
}

// RunUpdate holds partial update fields for a run. Nil fields are not updated.
message RunUpdate {
  optional RunStatus status = 1;
  optional kave.common.v1.Amount spent = 2;
  optional string error_message = 3;
  optional int64 ended_at_ms = 4;
  google.protobuf.Struct metadata = 5;
}

// RunFilter filters ListRuns queries. Pagination (limit, page_token) is
// carried on the enclosing request, not the filter itself.
message RunFilter {
  string project_id = 1;
  string env_id = 2;
  string agent_id = 3;
  RunStatus status = 4; // UNSPECIFIED = all statuses
  optional int64 from_ms = 5;
  optional int64 to_ms = 6;
  reserved 7, 8;
  reserved "limit", "page_token";
}
