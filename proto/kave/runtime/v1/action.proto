syntax = "proto3";

package kave.runtime.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/runtime/v1;runtime";

// ActionType discriminates the kind of action.
enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_LLM = 1; // LLM call: chat, embed, image, audio
  ACTION_TYPE_TOOL = 2; // Tool or function invocation
  ACTION_TYPE_RETRIEVAL = 3; // Data read: vector DB, SQL, file, memory
  ACTION_TYPE_MUTATION = 4; // Data write: DB, file, memory
  ACTION_TYPE_API = 5; // Outbound HTTP to external service
}

// ActionStatus is the lifecycle status of an action.
enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_PENDING = 1;
  ACTION_STATUS_RUNNING = 2;
  ACTION_STATUS_COMPLETED = 3;
  ACTION_STATUS_FAILED = 4;
  ACTION_STATUS_BLOCKED = 5;
  ACTION_STATUS_RETRYING = 6;
}

// ActionSource discriminates intercepted from observed actions.
enum ActionSource {
  ACTION_SOURCE_UNSPECIFIED = 0;
  ACTION_SOURCE_INTERCEPTED = 1; // Kave is in the causal path; can block
  ACTION_SOURCE_OBSERVED = 2; // learned outside a blockable boundary; audit only
}

// ActionRecord is the persisted representation of an intercepted or observed action.
// Maps to a single table; source discriminates intercepted from observed.
message ActionRecord {
  // Identity and topology
  string id = 1;
  string run_id = 2;
  string agent_id = 3;
  string project_id = 4;
  string env_id = 5;
  optional string parent_id = 6;

  // Target: what operation
  ActionType action_type = 7;
  string connector = 8;
  string method = 9;

  // Payloads: empty = not captured
  optional bytes input = 10;
  optional bytes output = 11;
  optional string error = 12;

  // Timing and ordering
  optional int64 started_at_ms = 13; // UnixMilli; nil = action not started
  optional int64 ended_at_ms = 14; // UnixMilli; nil = still running
  int32 depth = 15; // 0 = root
  int32 seq = 16; // sibling order within parent

  // Status and source
  ActionStatus status = 17;
  ActionSource source = 18;
  google.protobuf.Struct metadata = 19;

  // Retry/attempt metadata
  int32 attempt = 20; // 1-based; 1 = first attempt
  int32 max_attempts = 21; // 0 = no retry configured
  optional string retry_reason = 22; // reason for this retry
  optional string provider_req_id = 23; // X-Request-ID from upstream provider
  optional string external_id = 24; // client-supplied external correlation ID

  int64 created_at_ms = 25; // UnixMilli
}

// ActionFilter filters ListActions queries. Pagination (limit, cursor) is
// carried on the enclosing request, not the filter itself.
message ActionFilter {
  string run_id = 1;
  string agent_id = 2;
  ActionType action_type = 3; // UNSPECIFIED = all types
  ActionStatus status = 4; // UNSPECIFIED = all statuses
  ActionSource source = 5; // UNSPECIFIED = all sources
  reserved 6, 7;
  reserved "limit", "cursor";
}
