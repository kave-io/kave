syntax = "proto3";

package kave.control.v1;

import "kave/common/v1/common.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/control/v1;control";

// AgentToken is an authorization token issued to an agent.
// Raw token is shown once at creation, then only the hash is stored.
message AgentToken {
  string id = 1;
  string agent_id = 2;
  string project_id = 3; // for index queries

  // UX / identification
  string name = 4; // human name; "prod CLI key"
  string description = 5;
  string token_prefix = 6; // first 8 chars of raw token
  string hash = 7; // SHA256(rawToken)

  // Issuance
  string issued_for = 8; // "agent" | "service" | "cli" | "human" | "integration"
  string issued_by = 9; // user ID or "system"

  // Scope
  repeated string connectors = 10;
  repeated string methods = 11;
  optional kave.common.v1.Amount budget_cap = 12; // nil = no cap
  repeated string scopes = 13; // extension point for additional scope strings

  // Validity window
  int64 not_before_ms = 14; // UnixMilli
  optional int64 expires_at_ms = 15; // UnixMilli; nil = no expiry

  // Usage
  optional int64 last_used_at_ms = 16; // UnixMilli

  // Revocation (soft — for audit trail)
  optional int64 revoked_at_ms = 17; // UnixMilli; nil = active
  string revoked_by = 18;
  string revoke_reason = 19;

  int64 created_at_ms = 20; // UnixMilli
}

// AgentTokenUpdate holds partial update fields for a token (mainly revocation).
message AgentTokenUpdate {
  optional int64 revoked_at_ms = 1;
  optional string revoked_by = 2;
  optional string revoke_reason = 3;
}
