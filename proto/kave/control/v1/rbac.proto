syntax = "proto3";

package kave.control.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/control/v1;control";

// RBACService exposes role-based access control operations.
service RBACService {
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc ListRoles(google.protobuf.Empty) returns (ListRolesResponse);
  rpc GetRole(GetRoleRequest) returns (Role);
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);

  rpc CreateBinding(CreateBindingRequest) returns (Binding);
  rpc ListBindings(google.protobuf.Empty) returns (ListBindingsResponse);
  rpc DeleteBinding(DeleteBindingRequest) returns (google.protobuf.Empty);

  rpc TestPermission(TestPermissionRequest) returns (TestPermissionResponse);
}

// --- Roles ---

message CreateRoleRequest {
  string name = 1;
  repeated string permissions = 2;
}

message GetRoleRequest {
  string id = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message DeleteRoleRequest {
  string id = 1;
}

message Role {
  string id = 1;
  string name = 2;
  repeated string permissions = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

// --- Bindings ---

message CreateBindingRequest {
  string role_id = 1;
  string subject = 2;    // "user:<id>", "group:<id>", etc.
  string scope = 3;      // "*:*", "org:<id>:*", "project:<id>:*"
}

message ListBindingsResponse {
  repeated Binding bindings = 1;
}

message DeleteBindingRequest {
  string id = 1;
}

message Binding {
  string id = 1;
  string role_id = 2;
  string subject = 3;
  string scope = 4;
  int64 created_at = 5;
}

// --- Testing ---

message TestPermissionRequest {
  string subject = 1;    // "user:<id>", etc.
  string action = 2;     // "create", "read", "update", "delete"
  string resource = 3;   // "org:<id>", "project:<id>", etc.
}

message TestPermissionResponse {
  bool allowed = 1;
  string reason = 2;
}
