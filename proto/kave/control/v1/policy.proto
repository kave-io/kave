syntax = "proto3";

package kave.control.v1;

import "google/protobuf/struct.proto";
import "kave/common/v1/common.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/control/v1;control";

// PolicyMode determines how violations are handled.
enum PolicyMode {
  POLICY_MODE_UNSPECIFIED = 0;
  POLICY_MODE_ENFORCE = 1; // violations block the action
  POLICY_MODE_SHADOW = 2; // violations are recorded but not blocked
}

// PolicyStatus is the lifecycle status of a policy.
enum PolicyStatus {
  POLICY_STATUS_UNSPECIFIED = 0;
  POLICY_STATUS_ACTIVE = 1;
  POLICY_STATUS_ARCHIVED = 2;
}

// BudgetPeriod is the rollover window for a budget cap.
enum BudgetPeriod {
  BUDGET_PERIOD_UNSPECIFIED = 0;
  BUDGET_PERIOD_RUN = 1;
  BUDGET_PERIOD_DAILY = 2;
  BUDGET_PERIOD_MONTHLY = 3;
}

// BudgetBehavior is what happens when a budget cap is exceeded.
enum BudgetBehavior {
  BUDGET_BEHAVIOR_UNSPECIFIED = 0;
  BUDGET_BEHAVIOR_BLOCK = 1;
  BUDGET_BEHAVIOR_WARN = 2;
}

// PolicyRecord defines what an agent is allowed to do.
message PolicyRecord {
  string id = 1;
  string project_id = 2;
  string env_id = 3;
  string name = 4;
  string description = 5;
  repeated string allowed_types = 6; // action types allowed
  repeated string allowed_connectors = 7; // LLM providers, tools, etc.
  repeated string allowed_methods = 8; // e.g., "chat.completions"

  // Budget and cost control
  optional kave.common.v1.Amount budget_cap = 9; // nil = no cap
  BudgetPeriod budget_period = 10;
  BudgetBehavior budget_behavior = 11;

  // Trace capture and retention
  bool trace_input = 12; // capture inputs
  bool trace_output = 13; // capture outputs
  int32 retention_days = 14; // span retention in days

  // Untyped extension point for validation rules and custom policies
  google.protobuf.Struct config = 15;

  int32 version = 16; // server-managed; incremented on every update
  PolicyMode mode = 17;
  PolicyStatus status = 18;
  string created_by = 19; // user ID or "system"
  string updated_by = 20; // user ID or "system"
  int64 created_at_ms = 21; // UnixMilli
  int64 updated_at_ms = 22; // UnixMilli
}

// PolicyUpdate holds partial update fields for a policy. Nil/unset fields are not changed.
// Immutable fields (id, project_id, env_id, name, version, created_by, created_at_ms)
// are not present here; supply them in UpdatePolicyRequest.id only.
message PolicyUpdate {
  optional string description = 1;
  repeated string allowed_types = 2; // replaces the full list when non-empty
  repeated string allowed_connectors = 3; // replaces the full list when non-empty
  repeated string allowed_methods = 4; // replaces the full list when non-empty
  optional kave.common.v1.Amount budget_cap = 5; // nil = leave unchanged; use clear_budget_cap to remove
  bool clear_budget_cap = 6; // true = remove the budget cap
  optional BudgetPeriod budget_period = 7;
  optional BudgetBehavior budget_behavior = 8;
  optional bool trace_input = 9;
  optional bool trace_output = 10;
  optional int32 retention_days = 11;
  google.protobuf.Struct config = 12; // nil = leave unchanged
  optional PolicyMode mode = 13;
  optional PolicyStatus status = 14;
  optional string updated_by = 15;
}

message DeletePolicyRequest {
  string id = 1;
}

message ExportPolicyRequest {
  string id = 1;
}

message PolicyYAML {
  string yaml = 1;
}

message ValidatePolicyRequest {
  string yaml = 1;
}

message ValidatePolicyResponse {
  bool ok = 1;
  repeated string issues = 2;
}
