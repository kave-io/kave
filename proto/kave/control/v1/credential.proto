syntax = "proto3";

package kave.control.v1;

option go_package = "github.com/kave-io/kave/proto/gen/kave/control/v1;control";

// CredentialSource discriminates the storage tier for a credential.
enum CredentialSource {
  CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  CREDENTIAL_SOURCE_ENCRYPTED = 1; // Tier 2: encrypted-at-rest in Kave
  CREDENTIAL_SOURCE_VAULT_REF = 2; // Tier 1: external secret manager
  CREDENTIAL_SOURCE_OAUTH = 3; // Tier 3: ephemeral via OAuth
  CREDENTIAL_SOURCE_STS = 4; // Tier 3: ephemeral via cloud STS
  CREDENTIAL_SOURCE_PASSTHROUGH = 5; // Tier 4: no stored secret
}

// CredentialStatus is the lifecycle status of a credential.
enum CredentialStatus {
  CREDENTIAL_STATUS_UNSPECIFIED = 0;
  CREDENTIAL_STATUS_ACTIVE = 1;
  CREDENTIAL_STATUS_REVOKED = 2;
  CREDENTIAL_STATUS_EXPIRED = 3;
  CREDENTIAL_STATUS_PENDING_ROTATION = 4;
}

// ConnectorCredential holds a reference to or encrypted copy of an outbound secret.
// Kave uses this to call external systems on behalf of an agent.
// Supports all four tiers: external reference, encrypted local, ephemeral, pass-through.
message ConnectorCredential {
  string id = 1;
  string project_id = 2;
  string env_id = 3;

  // What this credential covers
  string connector_type = 4; // "openai" | "github" | "postgres" | "stripe" | ...
  string account_id = 5; // org/account/project within the connector; "" = default
  string label = 6; // "primary" | "billing" | "canary" | custom
  string description = 7;

  // Storage tier discriminator
  CredentialSource source_type = 8;

  // Tier 2: encrypted local secret
  bytes encrypted_blob = 9; // AES-256-GCM ciphertext; empty for non-encrypted tiers
  string key_hash = 10; // SHA256(plaintext); empty for non-encrypted tiers
  string wrapping_key_id = 11; // which master key encrypted this blob

  // Tier 1 + 3: external reference (never a secret itself)
  string secret_ref = 12; // Vault path, ARN, K8s secret ref, etc.
  string secret_version = 13; // version at the source; may be empty

  // Lifecycle
  CredentialStatus status = 14;
  int32 version = 15; // server-managed; incremented on rotation
  optional int64 expires_at_ms = 16; // UnixMilli; nil = no expiry
  optional int64 rotated_at_ms = 17; // UnixMilli; nil = never rotated
  string rotated_by = 18; // user ID or "system"
  optional int64 last_used_at_ms = 19; // UnixMilli
  optional int64 last_validated_at_ms = 20; // UnixMilli

  // Provenance
  string created_by = 21;
  int64 created_at_ms = 22; // UnixMilli
  int64 updated_at_ms = 23; // UnixMilli

  // Revocation
  optional int64 revoked_at_ms = 24; // UnixMilli; nil = active
  string revoked_by = 25;
  string revoke_reason = 26;
}

// CredentialUpdate holds mutable metadata fields for a credential.
// Secret rotation uses RotateCredential; status transitions use RevokeCredential.
message CredentialUpdate {
  optional string label = 1;
  optional string description = 2;
  optional string account_id = 3;
}

// CredentialFilter is used by ListCredentials to find matching credentials.
// Pagination (limit, cursor) is carried on the enclosing request.
message CredentialFilter {
  string env_id = 1;
  string connector_type = 2;
  string account_id = 3; // "" = match any account
  string label = 4; // "" = prefer "primary", then first active
  CredentialStatus status = 5; // UNSPECIFIED = active only (server default)
  reserved 6, 7;
  reserved "limit", "cursor";
}
