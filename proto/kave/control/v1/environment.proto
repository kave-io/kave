syntax = "proto3";

package kave.control.v1;

option go_package = "github.com/kave-io/kave/proto/gen/kave/control/v1;control";

// EnvironmentType discriminates predefined from custom environments.
enum EnvironmentType {
  ENVIRONMENT_TYPE_UNSPECIFIED = 0;
  ENVIRONMENT_TYPE_DEV = 1;
  ENVIRONMENT_TYPE_STAGING = 2;
  ENVIRONMENT_TYPE_PROD = 3;
  ENVIRONMENT_TYPE_CUSTOM = 4;
}

// Environment scopes agents, policies, credentials, and runtime data within a project.
// A project has at least one environment (default: "dev").
message Environment {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string slug = 4; // URL-safe; matches the type for built-ins, user-defined for custom
  EnvironmentType type = 5;
  int64 created_at_ms = 6; // UnixMilli
  int64 updated_at_ms = 7; // UnixMilli
}
