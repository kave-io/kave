syntax = "proto3";

package kave.control.v1;

import "google/protobuf/empty.proto";
import "kave/control/v1/agent.proto";
import "kave/control/v1/auth.proto";
import "kave/control/v1/budget.proto";
import "kave/control/v1/credential.proto";
import "kave/control/v1/daemon.proto";
import "kave/control/v1/environment.proto";
import "kave/control/v1/org.proto";
import "kave/control/v1/policy.proto";
import "kave/control/v1/project.proto";
import "kave/control/v1/rbac.proto";
import "kave/control/v1/token.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/control/v1;control";

// ControlPlaneAPI exposes organization, project, environment, agent, policy, credential, and token operations.
// v1: gRPC only. HTTP transcoding deferred to v1.1+.
service ControlPlaneService {
  // Organization operations
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization);
  rpc GetOrganization(GetOrganizationRequest) returns (Organization);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);

  // Project operations
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc GetProject(GetProjectRequest) returns (Project);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // Environment operations
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (Environment);
  rpc GetEnvironment(GetEnvironmentRequest) returns (Environment);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);

  // Agent operations
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc GetAgent(GetAgentRequest) returns (Agent);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent);
  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty);
  rpc RestoreAgent(RestoreAgentRequest) returns (Agent);

  // Policy operations
  rpc CreatePolicy(CreatePolicyRequest) returns (PolicyRecord);
  rpc GetPolicy(GetPolicyRequest) returns (PolicyRecord);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (PolicyRecord);
  rpc DeletePolicy(DeletePolicyRequest) returns (google.protobuf.Empty);
  rpc ExportPolicy(ExportPolicyRequest) returns (PolicyYAML);
  rpc ValidatePolicy(ValidatePolicyRequest) returns (ValidatePolicyResponse);

  // Token operations
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc GetToken(GetTokenRequest) returns (AgentToken);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (google.protobuf.Empty);

  // Credential operations
  rpc CreateCredential(CreateCredentialRequest) returns (ConnectorCredential);
  rpc GetCredential(GetCredentialRequest) returns (ConnectorCredential);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc UpdateCredential(UpdateCredentialRequest) returns (ConnectorCredential);
  rpc RotateCredential(RotateCredentialRequest) returns (ConnectorCredential);
  rpc RevokeCredential(RevokeCredentialRequest) returns (google.protobuf.Empty);
  rpc DeleteCredential(DeleteCredentialRequest) returns (google.protobuf.Empty);

  // Budget operations
  rpc CreateBudget(CreateBudgetRequest) returns (Budget);
  rpc GetBudget(GetBudgetRequest) returns (Budget);
  rpc DeleteBudget(DeleteBudgetRequest) returns (google.protobuf.Empty);
}

// --- Organization ---

message CreateOrganizationRequest {
  string name = 1;
  string slug = 2;
}

message GetOrganizationRequest {
  string id = 1;
}

message ListOrganizationsRequest {
  int32 limit = 1;
  string cursor = 2;
}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
  string next_cursor = 2;
}

// --- Project ---

message CreateProjectRequest {
  string org_id = 1;
  string name = 2;
  string slug = 3;
}

message GetProjectRequest {
  string id = 1;
}

message ListProjectsRequest {
  string org_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  string next_cursor = 2;
}

// --- Environment ---

message CreateEnvironmentRequest {
  string project_id = 1;
  string name = 2;
  string slug = 3;
  EnvironmentType type = 4;
}

message GetEnvironmentRequest {
  string id = 1;
}

message ListEnvironmentsRequest {
  string project_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
  string next_cursor = 2;
}

// --- Agent ---

message CreateAgentRequest {
  string env_id = 1;
  string name = 2;
  string description = 3;
  optional string policy_id = 4;
}

message GetAgentRequest {
  string id = 1;
}

message ListAgentsRequest {
  string env_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_cursor = 2;
}

message UpdateAgentRequest {
  string id = 1;
  AgentUpdate update = 2;
}

message DeleteAgentRequest {
  string id = 1;
}

message RestoreAgentRequest {
  string id = 1;
}

// --- Policy ---

message CreatePolicyRequest {
  string env_id = 1;
  string name = 2;
  string description = 3;
  PolicyMode mode = 4; // defaults to ENFORCE when unspecified
}

message GetPolicyRequest {
  string id = 1;
}

message ListPoliciesRequest {
  string env_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListPoliciesResponse {
  repeated PolicyRecord policies = 1;
  string next_cursor = 2;
}

message UpdatePolicyRequest {
  string id = 1;
  PolicyUpdate update = 2;
}

// --- Token ---

message CreateTokenRequest {
  string agent_id = 1;
  string name = 2;
}

message CreateTokenResponse {
  AgentToken token = 1;
  string raw_token = 2; // shown only once; not stored
}

message GetTokenRequest {
  string id = 1;
}

message ListTokensRequest {
  string agent_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListTokensResponse {
  repeated AgentToken tokens = 1;
  string next_cursor = 2;
}

message RevokeTokenRequest {
  string id = 1;
  string reason = 2;
}

// --- Credential ---

message CreateCredentialRequest {
  string env_id = 1;
  string connector_type = 2;
  string label = 3;
  bytes encrypted_blob = 4;
}

message GetCredentialRequest {
  string id = 1;
}

message ListCredentialsRequest {
  CredentialFilter filter = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListCredentialsResponse {
  repeated ConnectorCredential credentials = 1;
  string next_cursor = 2;
}

message UpdateCredentialRequest {
  string id = 1;
  CredentialUpdate update = 2;
}

message RotateCredentialRequest {
  string id = 1;
  bytes new_encrypted_blob = 2;
}

message RevokeCredentialRequest {
  string id = 1;
  string reason = 2;
}

message DeleteCredentialRequest {
  string id = 1;
}
