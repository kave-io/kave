syntax = "proto3";

package kave.control.v1;

import "kave/common/v1/common.proto";
import "kave/control/v1/policy.proto";

option go_package = "github.com/kave-io/kave/proto/gen/kave/control/v1;control";

// Budget is a per-agent spend cap configuration.
message Budget {
  string id = 1;
  string agent_id = 2;
  kave.common.v1.Amount hard_cap = 3;
  optional kave.common.v1.Amount soft_cap = 4;
  BudgetPeriod period = 5;
  int64 created_at_ms = 6;
  int64 updated_at_ms = 7;
}

message CreateBudgetRequest {
  string agent_id = 1;
  kave.common.v1.Amount hard_cap = 2;
  optional kave.common.v1.Amount soft_cap = 3;
  BudgetPeriod period = 4;
}

message GetBudgetRequest {
  string agent_id = 1;
}

message DeleteBudgetRequest {
  string agent_id = 1;
}
