# Buf workspace root for the canonical API contract.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Small control operations return their canonical entity directly (for
    # example IssuedServiceKey, SecretMetadata, and ProviderRouteActivation)
    # instead of adding one-field response envelopes.
    - RPC_RESPONSE_STANDARD_NAME
    # Revocation RPCs intentionally share google.protobuf.Empty responses.
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
